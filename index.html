<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>P-GPT AI</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #050505;
      color: white;
      min-height: 100vh;
      display: flex;
      justify-content: center;
    }
    .app {
      width: 100%;
      max-width: 600px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 18px;
      text-align: center;
      border-bottom: 1px solid #222;
      font-size: 22px;
      font-weight: bold;
    }
    #chat {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
    }
    .welcome {
      text-align: center;
      margin-top: 30vh;
      color: #aaa;
    }
    .message {
      padding: 12px 15px;
      margin: 10px 0;
      border-radius: 14px;
      line-height: 1.5;
      white-space: pre-wrap;
    }
    .user {
      background: #222;
      margin-left: 15%;
    }
    .ai {
      background: #111;
      border: 1px solid #222;
      margin-right: 10%;
    }
    .input-area {
      padding: 12px;
      display: flex;
      gap: 8px;
      border-top: 1px solid #222;
      background: #050505;
    }
    input {
      flex: 1;
      padding: 14px;
      border-radius: 25px;
      border: 1px solid #333;
      background: #151515;
      color: white;
      outline: none;
    }
    button {
      border: none;
      border-radius: 25px;
      padding: 0 20px;
      background: white;
      color: black;
      font-weight: bold;
    }
  </style>
</head>

<body>
  <div class="app">
    <header>🤖 P-GPT AI</header>

    <div id="chat">
      <div class="welcome">
        <h2>Welcome to P-GPT</h2>
        <p>Your smart AI assistant.</p>
      </div>
    </div>

    <div class="input-area">
      <input id="message" type="text" placeholder="Ask P-GPT anything...">
      <button onclick="sendMessage()">Send</button>
    </div>
  </div>

  <script>
    function sendMessage() {
      const input = document.getElementById("message");
      const chat = document.getElementById("chat");
      const text = input.value.trim();

      if (!text) return;

      const welcome = document.querySelector(".welcome");
      if (welcome) welcome.remove();

      const userMessage = document.createElement("div");
      userMessage.className = "message user";
      userMessage.textContent = text;
      chat.appendChild(userMessage);

      const aiMessage = document.createElement("div");
      aiMessage.className = "message ai";
      aiMessage.textContent =
        "P-GPT is ready. AI connection will be added in the next step.";
      chat.appendChild(aiMessage);

      input.value = "";
      chat.scrollTop = chat.scrollHeight;
    }

    document.getElementById("message").addEventListener("keydown", function(e) {
      if (e.key === "Enter") sendMessage();
    });
  </script>
</body>
</html>
