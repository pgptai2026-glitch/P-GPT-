<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>P-GPT</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #000;
      color: #fff;
      font-family: Arial, sans-serif;
      height: 100vh;
      overflow: hidden;
    }

    .app {
      height: 100vh;
      display: flex;
      flex-direction: column;
      max-width: 900px;
      margin: auto;
      background: #000;
    }

    /* TOP BAR */
    .topbar {
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      border-bottom: 1px solid #222;
    }

    .icon-btn {
      width: 42px;
      height: 42px;
      border: 0;
      background: transparent;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      border-radius: 50%;
    }

    .icon-btn:hover {
      background: #1a1a1a;
    }

    .brand {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: .5px;
    }

    .top-actions {
      display: flex;
      gap: 2px;
    }

    /* CHAT */
    .chat {
      flex: 1;
      overflow-y: auto;
      padding: 24px 16px 120px;
    }

    .welcome {
      min-height: 60vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .welcome h1 {
      font-size: 28px;
      margin-bottom: 8px;
    }

    .welcome p {
      color: #aaa;
      font-size: 15px;
    }

    .message-row {
      display: flex;
      margin: 22px 0;
    }

    .message-row.user {
      justify-content: flex-end;
    }

    .message-row.ai {
      justify-content: flex-start;
    }

    .message {
      max-width: 78%;
      line-height: 1.55;
      font-size: 16px;
    }

    .user .message {
      background: #171717;
      padding: 12px 15px;
      border-radius: 18px 18px 4px 18px;
    }

    .ai .message {
      background: transparent;
      padding: 4px 0;
    }

    /* SIX BUTTONS */
    .message-tools {
      display: flex;
      align-items: center;
      gap: 4px;
      margin-top: 8px;
    }

    .tool-btn {
      width: 34px;
      height: 34px;
      border: 0;
      background: traPtodat: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .tool-btn:hover {
      background: #171717;
    }

    .tool-btn svg {
      width: 18px;
      height: 18px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* INPUT */
    .input-wrap {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: min(900px, 100%);
      padding: 12px 14px 18px;
      background: linear-gradient(transparent, #000 18%);
    }

    .input-box {
      min-height: 54px;
      display: flex;
      align-items: center;
      gap: 6px;
      border: 1px solid #333;
      border-radius: 28px;
      padding: 5px 7px 5px 8px;
      background: #050505;
    }

    #messageInput {
      flex: 1;
      min-width: 0;
      resize: none;
      border: 0;
      outline: none;
      background: transparent;
      color: #fff;
      font-size: 16px;
      padding: 10px 6px;
      font-family: inherit;
      max-height: 120px;
    }

    #messageInput::placeholder {
      color: #888;
    }

    .input-btn {
      width: 42px;
      height: 42px;
      flex-shrink: 0;
      border: 0;
      border-radiu
      background: transparent;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .input-btn:hover {
      background: #1a1a1a;
    }

    .input-btn svg {
      width: 21px;
      height: 21px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .send-btn {
      background: #fff;
      color: #000;
      display: none;
    }

    .send-btn:hover {
      background: #ddd;
    }

    .live-btn {
      border: 1px solid #333;
    }

    /* MOBILE */
    @media (max-width: 600px) {
      .topbar {
        padding: 0 8px;
      }

      .chat {
        padding-left: 14px;
        padding-right: 14px;
      }

      .message {
        max-width: 86%;
      }

      .welcome h1 {
        font-size: 24px;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <!-- TOP -->
  <header class="topbar">

    <button class="icon-btn" aria-label="Menu">
      <svg width="22" height="22" viewBox="0 0 24 24">
        <path d="M4 7h16M4 12h16M4 17h16"
          stroke="currentColor"
          fill="none"
          stroke-width="2"
          stroke-linecap="round"/>
      </svg>
    </button>

    <div class="brand">P-GPT</div>

    <div class="top-actions">

      <!-- New Chat -->
      <button class="icon-btn" aria-label="New Chat">
        <svg width="21" height="21" viewBox="0 0 24 24">
          <path d="M12 20h9"/>
          <path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L8 18l-4 1 1-4Z"/>
        </svg>
      </button>

      <!-- More -->
      <button class="icon-btn" aria-label="More">
        <svg width="21" height="21" viewBox="0 0 24 24">
          <circle cx="5" cy="12" r="1.3" fill="currentColor"/>
          <circle cx="12" cy="12" r="1.3" fill="currentColor"/>
          <circle cx="19" cy="12" r="1.3" fill="currentColor"/>
        </svg>
      </button>

    </div>
  </header>


  <!-- CHAT -->
  <main class="chat" id="chatArea">

    <section class="welcome" id="welcome">
      <h1>How can I help you?</h1>
      <p>Ask anything to P-GPT</p>
    </section>


    <!-- USER MESSAGE -->
    <div class="message-row user">
      <div class="message">
      </div>
    </div>


    <!-- AI MESSAGE -->
    <div class="message-row ai">

      <div>

        <div class="message">
  
        </div>

        <div class="message-tools">

          <!-- COPY -->
          <button class="tool-btn" aria-label="Copy">
            <svg viewBox="0 0 24 24">
              <rect x="9" y="9" width="11" height="11" rx="2"/>
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
            </svg>
          </button>

          <!-- LIKE -->
          <button class="tool-btn" aria-label="Like">
            <svg viewBox="0 0 24 24">
              <path d="M7 10v10H4a2 2 0 0 1-2-2v-6a2 2 0 0 1 2-2h3Z"/>
              <path d="M7 20h10.5a2 2 0 0 0 1.9-1.4l2-6A2 2 0 0 0 19.5 10H15l.7-4.2A3 3 0 0 0 12.8 2L7 10"/>
            </svg>
          </button>

          <!-- DISLIKE -->
          <button class="tool-btn" aria-label="Dislike">
            <svg viewBox="0 0 24 24">
              <path d="M7 14V4H4a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h3Z"/>
              <path d="M7 4h10.5a2 2 0 0 1 1.9 1.4l2 6A2 2 0 0 1 19.5 14H15l.7 4.2a3 3 0 0 1-2.9 3.8L7 14"/>
            </svg>
          </button>

          <!-- SPEAKER -->
          <button class="tool-btn" aria-label="Speaker">
            <svg viewBox="0 0 24 24">
              <path d="M4 9v6h4l5 4V5L8 9H4Z"/>
              <path d="M17 9a4 4 0 0 1 0 6"/>
              <path d="M19.5 6.5a8 8 0 0 1 0 11"/>
            </svg>
          </button>

          <!-- SHARE -->
          <button class="tool-btn" aria-label="Share">
            <svg viewBox="0 0 24 24">
              <path d="M12 16V4"/>
              <path d="m7 9 5-5 5 5"/>
              <path d="M5 12v7a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-7"/>
            </svg>
          </button>

          <!-- MORE -->
          <button class="tool-btn" aria-label="More">
            <svg viewBox="0 0 24 24">
              <circle cx="5" cy="12" r="1.2" fill="currentColor"/>
              <circle cx="12" cy="12" r="1.2" fill="currentColor"/>
              <circle cx="19" cy="12" r="1.2" fill="currentColor"/>
            </svg>
          </button>

        </div>

      </div>
    </div>

  </main>


  <!-- INPUT -->
  <div class="input-wrap">

    <div class="input-box">

      <!-- PLUS -->
      <button class="input-btn" aria-label="Add">
        <svg viewBox="0 0 24 24">
          <path d="M12 5v14M5 12h14"/>
        </svg>
      </button>

      <textarea
        id="messageInput"
        rows="1"
        placeholder="Reply To P-GPT"></textarea>

      <!-- VOICE -->
      <button class="input-btn" id="voiceBtn" aria-label="Voice">
        <svg viewBox="0 0 24 24">
          <rect x="9" y="3" width="6" height="12" rx="3"/>
          <path d="M5 11a7 7 0 0 0 14 0"/>
          <path d="M12 18v3M9 21h6"/>
        </svg>
      </button>

      <!-- LIVE -->
      <button class="input-btn live-btn" id="liveBtn" aria-label="Live">
        <svg viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="8"/>
          <circle cx="12" cy="12" r="3" fill="currentColor"/>
        </svg>
      </button>

      <!-- SEND -->
      <button class="input-btn send-btn" id="sendBtn" aria-label="Send">
        <svg viewBox="0 0 24 24">
          <path d="m4 4 16 8-16 8 3-8-3-8Z"/>
          <path d="M7 12h13"/>
        </svg>
      </button>

    </div>

  </div>

</div>


<script>
  const input = document.getElementById("messageInput");
  const sendBtn = document.getElementById("sendBtn");
  const liveBtn = document.getElementById("liveBtn");

  function updateInputButtons() {
    const hasText = input.value.trim().length > 0;

    sendBtn.style.display = hasText ? "flex" : "none";
    liveBtn.style.display = hasText ? "none" : "flex";
  }

  input.addEventListener("input", updateInputButtons);

  sendBtn.addEventListener("click", () => {
    const text = input.value.trim();

    if (!text) return;

    alert("Message sent: " + text);
    input.value = "";
    updateInputButtons();
  });

  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();

      if (input.value.trim()) {
        sendBtn.click();
      }
    }
  });

  updateInputButtons();
</script>

</body>
</html>
