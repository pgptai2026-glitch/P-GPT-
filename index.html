<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>P-GPT</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  background:#000;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
  height:100vh;
  overflow:hidden;
}

button,input,textarea{
  font-family:inherit;
}

button{
  cursor:pointer;
}

.hidden{
  display:none !important;
}

/* ================= AUTH ================= */

.auth-screen{
  position:fixed;
  inset:0;
  background:#000;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  z-index:500;
}

.auth-box{
  width:100%;
  max-width:390px;
}

.auth-logo{
  text-align:center;
  font-size:32px;
  font-weight:700;
  margin-bottom:8px;
}

.auth-subtitle{
  text-align:center;
  color:#888;
  font-size:14px;
  margin-bottom:28px;
}

.auth-form{
  background:#111;
  border:1px solid #252525;
  border-radius:20px;
  padding:24px;
}

.auth-title{
  text-align:center;
  font-size:22px;
  font-weight:600;
  margin-bottom:20px;
}

.auth-label{
  display:block;
  color:#aaa;
  font-size:13px;
  margin:14px 0 7px;
}

.auth-input{
  width:100%;
  height:48px;
  background:#080808;
  color:#fff;
  border:1px solid #303030;
  border-radius:12px;
  outline:none;
  padding:0 14px;
  font-size:15px;
}

.auth-input:focus{
  border-color:#666;
}

.auth-button{
  width:100%;
  height:48px;
  margin-top:20px;
  border:0;
  border-radius:12px;
  background:#fff;
  color:#000;
  font-weight:600;
}

.auth-switch{
  text-align:center;
  color:#777;
  font-size:13px;
  margin-top:18px;
}

.auth-switch button{
  border:0;
  background:none;
  color:#fff;
  font-weight:600;
}

.auth-error{
  min-height:18px;
  color:#ff6b6b;
  font-size:13px;
  text-align:center;
  margin-top:12px;
}

/* ================= APP ================= */

.app{
  height:100vh;
  display:flex;
  flex-direction:column;
}

/* TOPBAR */

.topbar{
  height:58px;
  flex:none;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 14px;
  border-bottom:1px solid #1c1c1c;
  background:#000;
  position:relative;
  z-index:20;
}

.top-left,
.top-right{
  display:flex;
  align-items:center;
  gap:5px;
}

.logo-title{
  position:absolute;
  left:50%;
  transform:translateX(-50%);
  font-size:18px;
  font-weight:600;
}

.icon-btn{
  width:38px;
  height:38px;
  border:0;
  border-radius:10px;
  background:transparent;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
}

.icon-btn:hover{
  background:#171717;
}

.icon-btn svg{
  width:21px;
  height:21px;
  stroke:currentColor;
  fill:none;
  stroke-width:1.8;
  stroke-linecap:round;
  stroke-linejoin:round;
}

/* ================= CHAT ================= */

.chat{
  flex:1;
  overflow-y:auto;
  padding:25px 16px 130px;
}

.chat::-webkit-scrollbar{
  width:4px;
}

.chat::-webkit-scrollbar-thumb{
  background:#333;
  border-radius:10px;
}

/* WELCOME */

.welcome{
  height:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding-bottom:80px;
}

.welcome h1{
  font-size:28px;
  font-weight:600;
  margin-bottom:10px;
}

.welcome p{
  color:#888;
  font-size:15px;
}

/* MESSAGE */

.message-row{
  width:100%;
  display:flex;
  margin-bottom:24px;
}

.message-row.user{
  justify-content:flex-end;
}

.message-row.ai{
  justify-content:flex-start;
}

.message{
  max-width:82%;
  font-size:16px;
  line-height:1.6;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
}

.user .message{
  background:#202020;
  padding:11px 15px;
  border-radius:18px 18px 4px 18px;
}

.ai .message{
  padding:4px 0;
}

/* AI LOADING */

.ai-loading{
  display:flex;
  align-items:center;
  gap:7px;
  color:#888;
  padding:8px 0;
}

.loading-dot{
  width:6px;
  height:6px;
  border-radius:50%;
  background:#888;
  animation:pulse 1.2s infinite ease-in-out;
}

.loading-dot:nth-child(2){
  animation-delay:.15s;
}

.loading-dot:nth-child(3){
  animation-delay:.3s;
}

@keyframes pulse{
  0%,80%,100%{
    opacity:.25;
    transform:scale(.8);
  }
  40%{
    opacity:1;
    transform:scale(1);
  }
}

/* AI TOOLS */

.ai-tools{
  display:flex;
  align-items:center;
  gap:4px;
  margin-top:8px;
}

.tool-btn{
  width:34px;
  height:34px;
  border:0;
  background:transparent;
  color:#888;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:8px;
}

.tool-btn:hover{
  background:#171717;
  color:#fff;
}

.tool-btn svg{
  width:18px;
  height:18px;
  stroke:currentColor;
  fill:none;
  stroke-width:1.7;
  stroke-linecap:round;
  stroke-linejoin:round;
}

/* ================= INPUT ================= */

.input-area{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  padding:10px 12px 14px;
  background:linear-gradient(to top,#000 75%,transparent);
  z-index:30;
}

.input-box{
  max-width:850px;
  margin:auto;
  min-height:58px;
  background:#171717;
  border:1px solid #292929;
  border-radius:22px;
  display:flex;
  align-items:flex-end;
  padding:8px;
  gap:6px;
}

.input-btn{
  flex:none;
  width:40px;
  height:40px;
  border:0;
  border-radius:50%;
  background:transparent;
  color:#aaa;
  display:flex;
  align-items:center;
  justify-content:center;
}

.input-btn:hover{
  background:#242424;
  color:#fff;
}

.input-btn svg{
  width:20px;
  height:20px;
  stroke:currentColor;
  fill:none;
  stroke-width:1.8;
  stroke-linecap:round;
  stroke-linejoin:round;
}

#messageInput{
  flex:1;
  min-width:0;
  max-height:130px;
  resize:none;
  border:0;
  outline:none;
  background:transparent;
  color:#fff;
  font-size:16px;
  line-height:22px;
  padding:9px 4px;
}

#messageInput::placeholder{
  color:#777;
}

.send-btn{
  background:#fff;
  color:#000;
}

.send-btn:hover{
  background:#ddd;
  color:#000;
}

/* ================= SIDE MENU ================= */

.menu-overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.65);
  z-index:80;
}

.side-menu{
  position:fixed;
  left:0;
  top:0;
  bottom:0;
  width:290px;
  max-width:85%;
  background:#0b0b0b;
  border-right:1px solid #252525;
  z-index:90;
  padding:18px;
  transform:translateX(-100%);
  transition:transform .2s ease;
}

.side-menu.open{
  transform:translateX(0);
}

.menu-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:25px;
}

.menu-brand{
  font-size:20px;
  font-weight:600;
}

.menu-item{
  width:100%;
  height:48px;
  border:0;
  background:transparent;
  color:#ddd;
  display:flex;
  align-items:center;
  gap:13px;
  padding:0 12px;
  border-radius:10px;
  text-align:left;
  margin-bottom:6px;
}

.menu-item:hover{
  background:#181818;
}

.menu-item svg{
  width:20px;
  height:20px;
  stroke:currentColor;
  fill:none;
  stroke-width:1.7;
  stroke-linecap:round;
  stroke-linejoin:round;
}

.menu-user{
  color:#777;
  font-size:13px;
  padding:12px;
  border-top:1px solid #222;
  margin-top:20px;
  overflow:hidden;
  text-overflow:ellipsis;
}

/* ================= MORE ================= */

.more-menu{
  position:fixed;
  top:52px;
  right:10px;
  width:190px;
  background:#111;
  border:1px solid #292929;
  border-radius:13px;
  padding:6px;
  z-index:70;
  box-shadow:0 15px 40px rgba(0,0,0,.5);
}

.more-item{
  width:100%;
  height:42px;
  border:0;
  background:transparent;
  color:#ddd;
  border-radius:8px;
  display:flex;
  align-items:center;
  gap:10px;
  padding:0 10px;
  text-align:left;
}

.more-item:hover{
  background:#1d1d1d;
}

.more-item svg{
  width:18px;
  height:18px;
  stroke:currentColor;
  fill:none;
  stroke-width:1.7;
  stroke-linecap:round;
  stroke-linejoin:round;
}

/* ================= FILE PICKER ================= */

.file-panel{
  position:fixed;
  bottom:78px;
  left:10px;
  width:230px;
  background:#111;
  border:1px solid #292929;
  border-radius:14px;
  padding:7px;
  z-index:60;
  box-shadow:0 15px 40px rgba(0,0,0,.5);
}

.file-option{
  width:100%;
  height:45px;
  border:0;
  background:transparent;
  color:#ddd;
  display:flex;
  align-items:center;
  gap:11px;
  padding:0 10px;
  border-radius:9px;
  text-align:left;
}

.file-option:hover{
  background:#1d1d1d;
}

.file-option svg{
  width:19px;
  height:19px;
  stroke:currentColor;
  fill:none;
  stroke-width:1.7;
  stroke-linecap:round;
  stroke-linejoin:round;
}

/* ================= LIVE ================= */

.live-panel{
  position:fixed;
  inset:0;
  z-index:200;
  background:#000;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
}

.live-title{
  position:absolute;
  top:22px;
  font-size:20px;
  font-weight:600;
}

.live-circle{
  width:150px;
  height:150px;
  border-radius:50%;
  background:#171717;
  border:1px solid #333;
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:0 0 0 15px #080808;
}

.live-circle svg{
  width:55px;
  height:55px;
  stroke:#fff;
  fill:none;
  stroke-width:1.5;
  stroke-linecap:round;
  stroke-linejoin:round;
}

.live-status{
  margin-top:35px;
  color:#aaa;
  font-size:15px;
}

.live-controls{
  position:absolute;
  bottom:45px;
  display:flex;
  gap:18px;
}

.live-control{
  width:55px;
  height:55px;
  border-radius:50%;
  border:1px solid #333;
  background:#171717;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
}

.live-control svg{
  width:23px;
  height:23px;
  stroke:currentColor;
  fill:none;
  stroke-width:1.7;
  stroke-linecap:round;
  stroke-linejoin:round;
}

.live-end{
  background:#fff;
  color:#000;
}

/* ================= TOAST ================= */

.toast{
  position:fixed;
  left:50%;
  bottom:90px;
  transform:translateX(-50%) translateY(20px);
  background:#fff;
  color:#000;
  padding:10px 15px;
  border-radius:10px;
  font-size:13px;
  opacity:0;
  pointer-events:none;
  transition:.2s;
  z-index:1000;
}

.toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}

/* MOBILE */

@media(max-width:600px){

  .topbar{
    height:55px;
    padding:0 9px;
  }

  .logo-title{
    font-size:17px;
  }

  .chat{
    padding-left:13px;
    padding-right:13px;
  }

  .message{
    max-width:88%;
    font-size:15.5px;
  }

  .input-area{
    padding:8px 8px 12px;
  }

  .input-box{
    border-radius:20px;
  }

  .welcome h1{
    font-size:25px;
  }
}
</style>
</head>

<body>

<!-- ================= AUTH ================= -->

<div class="auth-screen" id="authScreen">

  <div class="auth-box">

    <div class="auth-logo">P-GPT</div>

    <div class="auth-subtitle">
      Your AI assistant
    </div>

    <!-- LOGIN -->

    <div class="auth-form" id="loginForm">

      <div class="auth-title">Login</div>

      <label class="auth-label">Email</label>

      <input
        class="auth-input"
        id="loginEmail"
        type="email"
        autocomplete="email"
        placeholder="Enter your email"
      >

      <label class="auth-label">Password</label>

      <input
        class="auth-input"
        id="loginPassword"
        type="password"
        autocomplete="current-password"
        placeholder="Enter your password"
      >

      <button class="auth-button" id="loginBtn">
        LOGIN
      </button>

      <div class="auth-error" id="loginError"></div>

      <div class="auth-switch">
        Don't have an account?
        <button id="showSignup">Sign Up</button>
      </div>

    </div>

    <!-- SIGNUP -->

    <div class="auth-form hidden" id="signupForm">

      <div class="auth-title">Create Account</div>

      <label class="auth-label">Name</label>

      <input
        class="auth-input"
        id="signupName"
        type="text"
        autocomplete="name"
        placeholder="Enter your name"
      >

      <label class="auth-label">Email</label>

      <input
        class="auth-input"
        id="signupEmail"
        type="email"
        autocomplete="email"
        placeholder="Enter your email"
      >

      <label class="auth-label">Password</label>

      <input
        class="auth-input"
        id="signupPassword"
        type="password"
        autocomplete="new-password"
        placeholder="Create a password"
      >

      <label class="auth-label">Confirm Password</label>

      <input
        class="auth-input"
        id="signupConfirm"
        type="password"
        autocomplete="new-password"
        placeholder="Confirm your password"
      >

      <button class="auth-button" id="signupBtn">
        CREATE ACCOUNT
      </button>

      <div class="auth-error" id="signupError"></div>

      <div class="auth-switch">
        Already have an account?
        <button id="showLogin">Login</button>
      </div>

    </div>

  </div>
</div>


<!-- ================= APP ================= -->

<div class="app hidden" id="app">

  <!-- TOPBAR -->

  <div class="topbar">

    <div class="top-left">

      <button class="icon-btn" id="menuBtn" title="Menu">

        <svg viewBox="0 0 24 24">
          <path d="M4 7h16"/>
          <path d="M4 12h16"/>
          <path d="M4 17h16"/>
        </svg>

      </button>

    </div>

    <div class="logo-title">
      P-GPT
    </div>

    <div class="top-right">

      <button class="icon-btn" id="newChatBtn" title="New chat">

        <svg viewBox="0 0 24 24">
          <path d="M12 20h9"/>
          <path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L8 18l-4 1 1-4Z"/>
        </svg>

      </button>

      <button class="icon-btn" id="moreBtn" title="More">

        <svg viewBox="0 0 24 24">
          <circle cx="5" cy="12" r="1"/>
          <circle cx="12" cy="12" r="1"/>
          <circle cx="19" cy="12" r="1"/>
        </svg>

      </button>

    </div>

  </div>


  <!-- CHAT -->

  <div class="chat" id="chat">

    <div class="welcome" id="welcome">

      <h1>How can I help you?</h1>

      <p>Ask anything to P-GPT</p>

    </div>

  </div>


  <!-- FILE MENU -->

  <div class="file-panel hidden" id="filePanel">

    <button class="file-option" id="photoBtn">

      <svg viewBox="0 0 24 24">
        <rect x="3" y="4" width="18" height="16" rx="2"/>
        <circle cx="8.5" cy="9" r="1.5"/>
        <path d="m21 15-5-5L5 20"/>
      </svg>

      Photo

    </button>

    <button class="file-option" id="fileBtn">

      <svg viewBox="0 0 24 24">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"/>
        <path d="M14 2v6h6"/>
        <path d="M8 13h8"/>
        <path d="M8 17h6"/>
      </svg>

      File

    </button>

  </div>


  <!-- INPUT -->

  <div class="input-area">

    <div class="input-box">

      <button class="input-btn" id="plusBtn" title="Add">

        <svg viewBox="0 0 24 24">
          <path d="M12 5v14"/>
          <path d="M5 12h14"/>
        </svg>

      </button>

      <textarea
        id="messageInput"
        rows="1"
        placeholder="Reply To P-GPT"
      ></textarea>

      <button class="input-btn" id="voiceBtn" title="Voice">

        <svg viewBox="0 0 24 24">
          <rect x="9" y="3" width="6" height="12" rx="3"/>
          <path d="M5 11a7 7 0 0 0 14 0"/>
          <path d="M12 18v3"/>
          <path d="M8 21h8"/>
        </svg>

      </button>

      <button class="input-btn" id="liveBtn" title="Live">

        <svg viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="8"/>
          <path d="M10 9l5 3-5 3Z"/>
        </svg>

      </button>

      <button class="input-btn send-btn" id="sendBtn" title="Send">

        <svg viewBox="0 0 24 24">
          <path d="M12 19V5"/>
          <path d="M6 11l6-6 6 6"/>
        </svg>

      </button>

    </div>

  </div>

</div>


<!-- ================= SIDE MENU ================= -->

<div class="menu-overlay hidden" id="menuOverlay"></div>

<div class="side-menu" id="sideMenu">

  <div class="menu-header">

    <div class="menu-brand">
      P-GPT
    </div>

    <button class="icon-btn" id="closeMenuBtn">

      <svg viewBox="0 0 24 24">
        <path d="M6 6l12 12"/>
        <path d="M18 6 6 18"/>
      </svg>

    </button>

  </div>

  <button class="menu-item" id="menuNewChat">

    <svg viewBox="0 0 24 24">
      <path d="M12 20h9"/>
      <path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L8 18l-4 1 1-4Z"/>
    </svg>

    New Chat

  </button>

  <button class="menu-item" id="menuHistory">

    <svg viewBox="0 0 24 24">
      <path d="M3 12a9 9 0 1 0 3-6.7"/>
      <path d="M3 4v5h5"/>
      <path d="M12 7v5l3 2"/>
    </svg>

    Chat History

  </button>

  <button class="menu-item" id="menuLogout">

    <svg viewBox="0 0 24 24">
      <path d="M10 17l5-5-5-5"/>
      <path d="M15 12H3"/>
      <path d="M21 3v18"/>
    </svg>

    Logout

  </button>

  <div class="menu-user" id="menuUser">
    Not logged in
  </div>

</div>


<!-- ================= MORE MENU ================= -->

<div class="more-menu hidden" id="moreMenu">

  <button class="more-item" id="clearChatBtn">

    <svg viewBox="0 0 24 24">
      <path d="M4 7h16"/>
      <path d="M10 11v6"/>
      <path d="M14 11v6"/>
      <path d="M6 7l1 14h10l1-14"/>
      <path d="M9 7V4h6v3"/>
    </svg>

    Clear Chat

  </button>

  <button class="more-item" id="logoutBtn">

    <svg viewBox="0 0 24 24">
      <path d="M10 17l5-5-5-5"/>
      <path d="M15 12H3"/>
      <path d="M21 3v18"/>
    </svg>

    Logout

  </button>

</div>


<!-- ================= LIVE ================= -->

<div class="live-panel hidden" id="livePanel">

  <div class="live-title">
    P-GPT Live
  </div>

  <div class="live-circle">

    <svg viewBox="0 0 24 24">
      <rect x="9" y="3" width="6" height="12" rx="3"/>
      <path d="M5 11a7 7 0 0 0 14 0"/>
      <path d="M12 18v3"/>
      <path d="M8 21h8"/>
    </svg>

  </div>

  <div class="live-status" id="liveStatus">
    Tap microphone to speak
  </div>

  <div class="live-controls">

    <button class="live-control" id="liveMicBtn" title="Microphone">

      <svg viewBox="0 0 24 24">
        <rect x="9" y="3" width="6" height="12" rx="3"/>
        <path d="M5 11a7 7 0 0 0 14 0"/>
        <path d="M12 18v3"/>
        <path d="M8 21h8"/>
      </svg>

    </button>

    <button class="live-control live-end" id="liveEndBtn" title="End">

      <svg viewBox="0 0 24 24">
        <path d="M6 6l12 12"/>
        <path d="M18 6 6 18"/>
      </svg>

    </button>

  </div>

</div>


<!-- FILE INPUTS -->

<input
  type="file"
  id="photoInput"
  accept="image/*"
  hidden
>

<input
  type="file"
  id="fileInput"
  hidden
>


<!-- TOAST -->

<div class="toast" id="toast"></div>


<script>

/* =========================================================
   P-GPT CONFIG
   ========================================================= */

/*
   IMPORTANT:
   Replace this with your Cloudflare Worker URL.

   Example:
   const API_BASE =
   "https://p-gpt-api.example.workers.dev";
*/

const API_BASE = "https://YOUR-WORKER-URL.workers.dev";


/* =========================================================

/* =========================================================
   TOAST
   ========================================================= */

function showToast(message){

  toast.textContent = message;

  toast.classList.add("show");

  setTimeout(function(){

    toast.classList.remove("show");

  },2200);

}


/* =========================================================
   AUTH SCREEN
   ========================================================= */

function showLogin(){

  signupForm.classList.add("hidden");
  loginForm.classList.remove("hidden");

  loginError.textContent = "";
  signupError.textContent = "";

}


function showSignup(){

  loginForm.classList.add("hidden");
  signupForm.classList.remove("hidden");

  loginError.textContent = "";
  signupError.textContent = "";

}


document
  .getElementById("showSignup")
  .addEventListener("click",showSignup);


document
  .getElementById("showLogin")
  .addEventListener("click",showLogin);


/* =========================================================
   API HELPER
   ========================================================= */

async function apiRequest(
  endpoint,
  options = {}
){

  const response =
    await fetch(
      API_BASE + endpoint,
      {
        credentials:"include",
        ...options,
        headers:{
          "Content-Type":"application/json",
          ...(options.headers || {})
        }
      }
    );

  let data = {};

  try{

    data = await response.json();

  }catch(error){

    data = {};

  }

  if(!response.ok){

    throw new Error(
      data.error ||
      "Request failed."
    );

  }

  return data;

}


/* =========================================================
   CHECK LOGIN
   ========================================================= */

async function checkSession(){

  /*
    If Worker is not connected yet,
    keep the Login screen visible.
  */

  if(
    API_BASE.includes("YOUR-WORKER-URL")
  ){

    return;

  }

  try{

    const data =
      await apiRequest("/api/me");

    if(data.loggedIn){

      showApp(
        data.user
      );

    }

  }catch(error){

    console.log(
      "Session check:",
      error.message
    );

  }

}


/* =========================================================
   SHOW APP
   ========================================================= */

function showApp(user = null){

  authScreen.classList.add("hidden");

  app.classList.remove("hidden");

  if(user){

    document
      .getElementById("menuUser")
      .textContent =
      user.email ||
      user.name ||
      "";

  }

}


/* =========================================================
   SIGNUP
   ========================================================= */

document
  .getElementById("signupBtn")
  .addEventListener(
    "click",
    async function(){

      const name =
        document
          .getElementById("signupName")
          .value
          .trim();

      const email =
        document
          .getElementById("signupEmail")
          .value
          .trim();

      const password =
        document
          .getElementById("signupPassword")
          .value;

      const confirm =
        document
          .getElementById("signupConfirm")
          .value;

      signupError.textContent = "";

      if(
        !name ||
        !email ||
        !password ||
        !confirm
      ){

        signupError.textContent =
          "Please fill in all fields.";

        return;

      }

      if(password.length < 6){

        signupError.textContent =
          "Password must be at least 6 characters.";

        return;

      }

      if(password !== confirm){

        signupError.textContent =
          "Passwords do not match.";

        return;

      }

      try{

        const data =
          await apiRequest(
            "/api/signup",
            {
              method:"POST",
              body:JSON.stringify({
                name,
                email,
                password
              })
            }
          );

        showApp(data.user);

        showToast(
          "Account created"
        );

      }catch(error){

        signupError.textContent =
          error.message;

      }

    }
  );


/* =========================================================
   LOGIN
   ========================================================= */

document
  .getElementById("loginBtn")
  .addEventListener(
    "click",
    async function(){

      const email =
        document
          .getElementById("loginEmail")

          .getElementById("loginPassword")
          .value;

      loginError.textContent = "";

      if(!email || !password){

      try{

          await apiRequest(
            "/api/login",
            {
              method:"POST",
              body:JSON.stringify({
                email,
                password
              })
            }
          );

        showApp(data.user);

        showToast(
          "Login successful"
        );

      }catch(error){

        loginError.textContent =
          error.message;

/* =========================================================
   LOGOUT
   ========================================================= */

async function logout(){

  try{

    if(
      !API_BASE.includes(
        "YOUR-WORKER-URL"
      )
    ){

      await apiRequest(
        "/api/logout",
        {
          method:"POST"
        }
      );

    }

  }catch(error){

    console.log(error);

  }

  app.classList.add("hidden");

  authScreen.classList.remove("hidden");

  document
    .getElementById("moreMenu")
    .classList.add("hidden");

  closeSideMenu();

  showLogin();

  showToast(
    "Logged out"
  );

}

  .getElementById("logoutBtn")
  .addEventListener(
    "click",
    logout
  );


document
  .getElementById("menuLogout")
  .addEventListener(
    "click",
    logout
  );


/* =========================================================
   SEND MESSAGE
   ========================================================= */

async function sendMessage(){

  const text =
    input.value.trim();

  if(!text){

    return;

  }

  const welcome =
    document.getElementById(
      "welcome"
    );

  if(welcome){

    welcome.remove();

  }

  addUserMessage(text);

  input.value = "";

  input.style.height =
    "auto";

  chat.scrollTop =
    chat.scrollHeight;

  const loading =
    addLoadingMessage();

  try{

    /*
      REAL AI API

      Worker endpoint:
      POST /api/chat

      Body:
      {
        "message":"Hello"
      }
    */

    const data =
      await apiRequest(
        "/api/chat",
        {
          method:"POST",
          body:JSON.stringify({
            message:text
          })
        }
      );

    loading.remove();

    const answer =
      data.reply ||
      data.response ||
      data.message ||
      "No response received.";

    addAIMessage(
      answer
    );

  }catch(error){

    loading.remove();

    addAIMessage(
      "Unable to connect to P-GPT AI."
    );

    console.error(
      "AI API error:",
      error
    );

  }

}


/* =========================================================
   USER MESSAGE
   ========================================================= */

function addUserMessage(text){

  const row =
    document.createElement(
      "div"
    );

  row.className =
    "message-row user";

  const message =
    document.createElement(
      "div"
    );

  message.className =
    "message";

  message.textContent =
    text;

  row.appendChild(
    message
  );

  chat.appendChild(
    row
  );

}


/* =========================================================
   LOADING
   ========================================================= */

function addLoadingMessage(){

  const row =
    document.createElement(
      "div"
    );

  row.className =
    "message-row ai";

  row.innerHTML = `
    <div class="ai-loading">
      <span class="loading-dot"></span>
      <span class="loading-dot"></span>
      <span class="loading-dot"></span>
    </div>
  `;

  chat.appendChild(
    row
  );

  chat.scrollTop =
    chat.scrollHeight;

  return row;

}


/* =========================================================
   AI MESSAGE
   ========================================================= */

function addAIMessage(text){

  const row =
    document.createElement(
      "div"
    );

  row.className =
    "message-row ai";

  const wrapper =
    document.createElement(
      "div"
    );

  const message =
    document.createElement(
      "div"
    );

  message.className =
    "message";

  message.textContent =
    text;

  wrapper.appendChild(
    message
  );


  const tools =
    document.createElement(
      "div"
    );

  tools.className =
    "ai-tools";


  tools.innerHTML = `

    <button
      class="tool-btn copy-btn"
      title="Copy"
    >
      <svg viewBox="0 0 24 24">
        <rect
          x="9"
          y="9"
          width="11"
          height="11"
          rx="2"
        />
        <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
      </svg>
    </button>


    <button
      class="tool-btn speak-btn"
      title="Read aloud"
    >
      <svg viewBox="0 0 24 24">
        <path d="M11 5 6 9H3v6h3l5 4V5Z"/>
        <path d="M15 9a4 4 0 0 1 0 6"/>
        <path d="M18 6a8 8 0 0 1 0 12"/>
      </svg>
    </button>


    <button
      class="tool-btn share-btn"
      title="Share"
    >
      <svg viewBox="0 0 24 24">
        <circle cx="18" cy="5" r="2"/>
        <circle cx="6" cy="12" r="2"/>
        <circle cx="18" cy="19" r="2"/>
        <path d="m8 11 8-5"/>
        <path d="m8 13 8 5"/>
      </svg>
    </button>

  `;

  wrapper.appendChild(
    tools
  );

  row.appendChild(
    wrapper
  );

  chat.appendChild(
    row
  );


  /* COPY */

  tools
    .querySelector(".copy-btn")
    .addEventListener(
      "click",
      async function(){

        try{

          await navigator
            .clipboard
            .writeText(text);

          showToast(
            "Copied"
          );

        }catch(error){

          showToast(
            "Copy failed"
          );

        }

      }
    );


  /* SPEAK */

  tools
    .querySelector(".speak-btn")
    .addEventListener(
      "click",
      function(){

        speakText(text);

      }
    );


  /* SHARE */

  tools
    .querySelector(".share-btn")
    .addEventListener(
      "click",
      async function(){

        try{

          if(
            navigator.share
          ){

            await navigator.share({
              title:"P-GPT",
              text:text
            });

          }else{

            await navigator
              .clipboard
              .writeText(text);

            showToast(
              "Copied"
            );

          }

        }catch(error){

          console.log(error);

        }

      }
    );


  chat.scrollTop =
    chat.scrollHeight;

}

      event.key === "Enter" &&
      !event.shiftKey
    ){

      event.preventDefault();

);

/* =========================================================
   VOICE INPUT
   ========================================================= */

const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;

let recognition = null;

if(SpeechRecognition){

  recognition =
    new SpeechRecognition();

  recognition.lang =
    "en-US";

  recognition.continuous =
    false;

  recognition.interimResults =
    false;


  recognition.onstart =
    function(){

      liveStatus.textContent =
        "Listening...";

    };


  recognition.onresult =
    function(event){

      const spoken =
        event
          .results[0][0]
          .transcript;

      input.value =
        spoken;

      input.dispatchEvent(
        new Event("input")
      );

      if(
        !livePanel.classList.contains(
          "hidden"
        )
      ){

        liveStatus.textContent =
          "Processing...";

      }

      sendMessage();

    };


  recognition.onerror =
    function(){

      liveStatus.textContent =
        "Microphone error";

      showToast(
        "Microphone error"
      );

    };


  recognition.onend =
    function(){

      if(
        !livePanel.classList.contains(
          "hidden"
        )
      ){

        liveStatus.textContent =
          "Tap microphone to speak";

      }

    };

}


/* NORMAL VOICE */

document
  .getElementById("voiceBtn")
  .addEventListener(
    "click",
    function(){

      if(!recognition){

        showToast(
          "Voice recognition is not supported"
        );

        return;

      }

      try{

        recognition.start();

      }catch(error){

        console.log(error);

      }

    }
  );

   LIVE
   ========================================================= */

document
  .getElementById("liveBtn")
  .addEventListener(
    "click",
    function(){

  .getElementById("liveMicBtn")
  .addEventListener(

      }

      try{

      }catch(error){

      }

  );


document
  .getElementById("liveEndBtn")
  .addEventListener(
    "click",
    function(){

      if(recognition){

        try{

          recognition.stop();

        }catch(error){}

      }

      livePanel.classList.add(
        "hidden"
      );

      liveStatus.textContent =
        "Tap microphone to speak";

    }
  );


/* =========================================================
   TEXT TO SPEECH
   ========================================================= */

function speakText(text){

  if(
    !("speechSynthesis" in window)
  ){

    showToast(
      "Voice playback is not supported"
    );

    return;

  }

  speechSynthesis.cancel();

  const speech =
    new SpeechSynthesisUtterance(
      text
    );

  speech.lang =
    "en-US";

  speech.rate =
    1;

  speech.pitch =
    1;

  speechSynthesis.speak(
    speech
  );

}
