<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>P-GPT</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #000;
      color: #fff;
      font-family: Arial, sans-serif;
      height: 100vh;
      overflow: hidden;
    }

    .app {
      width: 100%;
      max-width: 700px;
      height: 100vh;
      margin: auto;
      display: flex;
      flex-direction: column;
    }

    header {
      height: 58px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-bottom: 1px solid #222;
      font-size: 20px;
      font-weight: 600;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 20px 16px 110px;
    }

    .welcome {
      text-align: center;
      color: #aaa;
      margin-top: 30vh;
    }

    .welcome h2 {
      color: #fff;
      margin-bottom: 8px;
    }

    .message-row {
      display: flex;
      width: 100%;
      margin: 18px 0;
    }

    .message-row.user {
      justify-content: flex-end;
    }

    .message-row.ai {
      justify-content: flex-start;
    }

    .message {
      max-width: 85%;
      line-height: 1.6;
      white-space: pre-wrap;
      font-size: 16px;
    }

    .user .message {
      text-align: right;
    }

    .ai .message {
      text-align: left;
    }

    .actions {
      display: flex;
      gap: 18px;
      margin-top: 10px;
      color: #999;
      font-size: 17px;
    }

    .actions button {
      background: none;
      border: none;
      color: #999;
      padding: 0;
      cursor: pointer;
      font-size: 17px;
    }

    .actions button:hover {
      color: #fff;
    }

    .input-area {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 700px;
      padding: 10px 12px 14px;
      background: #000;
    }

    .input-box {
      min-height: 52px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 8px;
      border: 1px solid #333;
      border-radius: 28px;
      background: #111;
    }

    .icon-btn {
      width: 38px;
      height: 38px;
      border: none;
      border-radius: 50%;
      background: transparent;
      color: #fff;
      font-size: 23px;
      cursor: pointer;
      flex-shrink: 0;
    }

    #message {
      flex: 1;
      border: none;
      outline: none;
      background: transparent;
      color: #fff;
      font-size: 16px;
      min-width: 0;
    }

    #message::placeholder {
      color: #888;
    }

    #sendBtn {
      display: none;
      background: #fff;
      color: #000;
      font-size: 20px;
    }

    .voice-btn {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    @media (max-width: 500px) {
      header {
        font-size: 18px;
      }

      .message {
        max-width: 90%;
      }

      .actions {
        gap: 16px;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <header>P-GPT</header>

  <div id="chat">

    <div class="welcome">
      <h2>Welcome to P-GPT</h2>
      <p>How can I help you today? 😊</p>
    </div>

  </div>

  <div class="input-area">
    <div class="input-box">

      <button class="icon-btn" onclick="openFiles()">＋</button>

      <input
        id="message"
        type="text"
        placeholder="Reply To P-GPT"
        autocomplete="off"
      >

      <button
        id="voiceBtn"
        class="icon-btn voice-btn"
        onclick="startVoice()"
      >🎙️</button>

      <button
        id="sendBtn"
        class="icon-btn"
        onclick="sendMessage()"
      >⬆️</button>

    </div>
  </div>

</div>

<script>

  const input = document.getElementById("message");
  const sendBtn = document.getElementById("sendBtn");
  const voiceBtn = document.getElementById("voiceBtn");
  const chat = document.getElementById("chat");

  input.addEventListener("input", function () {

    if (input.value.trim().length > 0) {
      voiceBtn.style.display = "none";
      sendBtn.style.display = "flex";
    } else {
      voiceBtn.style.display = "flex";
      sendBtn.style.display = "none";
    }

  });

  input.addEventListener("keydown", function(e) {

    if (e.key === "Enter") {
      e.preventDefault();
      sendMessage();
    }

  });

  function sendMessage() {

    const text = input.value.trim();

    if (!text) return;

    const welcome = document.querySelector(".welcome");

    if (welcome) {
      welcome.remove();
    }

    // User message
    const userRow = document.createElement("div");
    userRow.className = "message-row user";

    const userMessage = document.createElement("div");
    userMessage.className = "message";
    userMessage.textContent = text;

    userRow.appendChild(userMessage);
    chat.appendChild(userRow);

    // Demo AI response
    const aiRow = document.createElement("div");
    aiRow.className = "message-row ai";

    const aiContainer = document.createElement("div");

    const aiMessage = document.createElement("div");
    aiMessage.className = "message";
    aiMessage.textContent =
      "P-GPT is ready. 🤖\nYour real AI connection will be added next.";

    aiContainer.appendChild(aiMessage);

    // Six action buttons
    const actions = document.createElement("div");
    actions.className = "actions";

    actions.innerHTML = `
      <button onclick="likeMessage(this)">👍</button>
      <button onclick="dislikeMessage(this)">👎</button>
      <button onclick="regenerateMessage()">🔄</button>
      <button onclick="copyMessage(this)">📋</button>
      <button onclick="readMessage(this)">🔊</button>
      <button onclick="shareMessage(this)">↗️</button>
    `;

    aiContainer.appendChild(actions);
    aiRow.appendChild(aiContainer);
    chat.appendChild(aiRow);

    input.value = "";
    voiceBtn.style.display = "flex";
    sendBtn.style.display = "none";

    chat.scrollTop = chat.scrollHeight;
  }

  function openFiles() {
    alert("Photo and file upload will be connected next.");
  }

  function startVoice() {
    alert("P-GPT Live Voice will be connected next.");
  }

  function likeMessage(button) {
    button.style.color = "#fff";
  }

  function dislikeMessage(button) {
    button.style.color = "#fff";
  }

  function regenerateMessage() {
    alert("Regenerate will be connected to the AI next.");
  }

  function copyMessage(button) {
    const message =
      button.closest(".ai").querySelector(".message");

    navigator.clipboard.writeText(message.textContent);
  }

  function readMessage(button) {
    const message =
      button.closest(".ai").querySelector(".message");

    const speech = new SpeechSynthesisUtterance(
      message.textContent
    );

    speechSynthesis.speak(speech);
  }

  function shareMessage(button) {

    const message =
      button.closest(".ai").querySelector(".message");

    if (navigator.share) {

      navigator.share({
        title: "P-GPT",
        text: message.textContent
      });

    } else {

      navigator.clipboard.writeText(message.textContent);
      alert("Response copied.");

    }
  }

</script>

</body>
</html>
