<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>P-GPT</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  background:#000;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
  height:100vh;
  overflow:hidden;
}

button,
textarea,
input{
  font-family:inherit;
}

button{
  cursor:pointer;
}

.hidden{
  display:none!important;
}

/* AUTH */

#authScreen{
  width:100%;
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#000;
  padding:20px;
}

.authBox{
  width:100%;
  max-width:390px;
  background:#0d0d0d;
  border:1px solid #252525;
  border-radius:22px;
  padding:30px 22px;
}

.logo{
  text-align:center;
  font-size:32px;
  font-weight:800;
  margin-bottom:8px;
}

.logo span{
  color:#777;
}

.authSub{
  text-align:center;
  color:#888;
  font-size:14px;
  margin-bottom:28px;
}

.authBox input{
  width:100%;
  height:50px;
  background:#171717;
  color:#fff;
  border:1px solid #2b2b2b;
  border-radius:12px;
  padding:0 15px;
  outline:none;
  margin-bottom:12px;
}

.authBox input:focus{
  border-color:#555;
}

.authBtn{
  width:100%;
  height:50px;
  border:0;
  border-radius:12px;
  background:#fff;
  color:#000;
  font-weight:700;
  font-size:15px;
  margin-top:5px;
}

.switchAuth{
  text-align:center;
  color:#777;
  font-size:13px;
  margin-top:18px;
}

.switchAuth button{
  background:none;
  border:0;
  color:#fff;
  font-weight:600;
}

/* APP */

#app{
  width:100%;
  height:100vh;
  display:flex;
  flex-direction:column;
}

/* TOP */

.topbar{
  height:62px;
  min-height:62px;
  border-bottom:1px solid #202020;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 14px;
  background:#050505;
}

.topLeft,
.topRight{
  display:flex;
  align-items:center;
  gap:7px;
}

.brand{
  font-size:20px;
  font-weight:800;
  margin-left:5px;
}

.iconBtn{
  width:38px;
  height:38px;
  border:0;
  border-radius:10px;
  background:transparent;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
}

.iconBtn:hover{
  background:#181818;
}

.iconBtn svg{
  width:20px;
  height:20px;
  fill:none;
  stroke:currentColor;
  stroke-width:1.8;
  stroke-linecap:round;
  stroke-linejoin:round;
}

/* CHAT */

#chat{
  flex:1;
  overflow-y:auto;
  padding:20px 14px 120px;
}

.empty{
  height:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  color:#777;
  text-align:center;
}

.emptyLogo{
  width:60px;
  height:60px;
  border:1px solid #333;
  border-radius:18px;
  display:flex;
  align-items:center;
  justify-content:center;
  margin-bottom:18px;
  font-size:25px;
  font-weight:800;
  color:#fff;
}

.empty h2{
  color:#eee;
  font-size:23px;
  margin-bottom:8px;
}

.empty p{
  font-size:14px;
}

/* MESSAGE */

.messageRow{
  width:100%;
  display:flex;
  margin:12px 0;
}

.messageRow.user{
  justify-content:flex-end;
}

.messageRow.ai{
  justify-content:flex-start;
}

.message{
  max-width:min(82%,700px);
  padding:12px 14px;
  border-radius:16px;
  line-height:1.55;
  font-size:15px;
  white-space:pre-wrap;
  word-break:break-word;
}

.user .message{
  background:#fff;
  color:#000;
  border-bottom-right-radius:5px;
}

.ai .message{
  background:#151515;
  color:#eee;
  border:1px solid #252525;
  border-bottom-left-radius:5px;
}

.messageTools{
  display:flex;
  gap:4px;
  margin-top:7px;
}

.messageTools button{
  width:31px;
  height:31px;
  border:0;
  background:transparent;
  color:#777;
  border-radius:8px;
}

.messageTools button:hover{
  background:#222;
  color:#fff;
}

.messageTools svg{
  width:16px;
  height:16px;
  fill:none;
  stroke:currentColor;
  stroke-width:1.8;
  stroke-linecap:round;
  stroke-linejoin:round;
}

/* LOADING */

.loading{
  display:flex;
  align-items:center;
  gap:8px;
  color:#888;
  font-size:14px;
}

.spinner{
  width:16px;
  height:16px;
  border:2px solid #333;
  border-top-color:#fff;
  border-radius:50%;
  animation:spin .8s linear infinite;
}

@keyframes spin{
  to{transform:rotate(360deg)}
}

/* INPUT */

.inputArea{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  padding:10px 12px 14px;
  background:linear-gradient(transparent,#000 25%);
}

.inputBox{
  max-width:850px;
  margin:auto;
  min-height:58px;
  background:#111;
  border:1px solid #292929;
  border-radius:18px;
  display:flex;
  align-items:flex-end;
  padding:8px;
  gap:5px;
}

.toolBtn{
  width:38px;
  height:38px;
  flex:0 0 38px;
  border:0;
  background:transparent;
  color:#aaa;
  border-radius:10px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.toolBtn:hover{
  background:#222;
  color:#fff;
}

.toolBtn svg{
  width:20px;
  height:20px;
  fill:none;
  stroke:currentColor;
  stroke-width:1.8;
  stroke-linecap:round;
  stroke-linejoin:round;
}

#prompt{
  flex:1;
  min-height:38px;
  max-height:130px;
  resize:none;
  border:0;
  outline:0;
  background:transparent;
  color:#fff;
  padding:9px 5px;
  font-size:15px;
}

#prompt::placeholder{
  color:#666;
}

.sendBtn{
  width:40px;
  height:40px;
  flex:0 0 40px;
  border:0;
  border-radius:11px;
  background:#fff;
  color:#000;
  display:flex;
  align-items:center;
  justify-content:center;
}

.sendBtn:disabled{
  opacity:.35;
}

.sendBtn svg{
  width:19px;
  height:19px;
  fill:none;
  stroke:currentColor;
  stroke-width:2;
  stroke-linecap:round;
  stroke-linejoin:round;
}

/* MENU */

.menu{
  position:fixed;
  top:57px;
  right:10px;
  width:210px;
  background:#111;
  border:1px solid #292929;
  border-radius:14px;
  padding:6px;
  z-index:50;
  box-shadow:0 15px 40px rgba(0,0,0,.6);
}

.menu button{
  width:100%;
  height:43px;
  border:0;
  background:transparent;
  color:#ddd;
  border-radius:9px;
  display:flex;
  align-items:center;
  gap:10px;
  padding:0 11px;
  text-align:left;
}

.menu button:hover{
  background:#222;
}

.menu svg{
  width:18px;
  height:18px;
  fill:none;
  stroke:currentColor;
  stroke-width:1.8;
  stroke-linecap:round;
  stroke-linejoin:round;
}

/* LIVE */

.livePanel{
  position:fixed;
  inset:0;
  background:#000;
  z-index:100;
  display:flex;
  flex-direction:column;
}

.liveTop{
  height:62px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 14px;
  border-bottom:1px solid #222;
}

.liveTitle{
  font-weight:700;
}

.liveCenter{
  flex:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
}

.liveCircle{
  width:110px;
  height:110px;
  border-radius:50%;
  border:1px solid #333;
  display:flex;
  align-items:center;
  justify-content:center;
  margin-bottom:25px;
}

.liveCircle svg{
  width:38px;
  height:38px;
  fill:none;
  stroke:#fff;
  stroke-width:1.7;
  stroke-linecap:round;
  stroke-linejoin:round;
}

.liveStatus{
  color:#888;
  font-size:14px;
  margin-bottom:20px;
}

.liveMic{
  width:58px;
  height:58px;
  border:0;
  border-radius:50%;
  background:#fff;
  color:#000;
  display:flex;
  align-items:center;
  justify-content:center;
}

.liveMic svg{
  width:24px;
  height:24px;
  fill:none;
  stroke:currentColor;
  stroke-width:1.8;
  stroke-linecap:round;
  stroke-linejoin:round;
}

/* FILE PREVIEW */

.filePreview{
  max-width:850px;
  margin:0 auto 7px;
  background:#111;
  border:1px solid #292929;
  border-radius:12px;
  padding:8px 10px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  color:#bbb;
  font-size:13px;
}

.filePreview button{
  border:0;
  background:none;
  color:#aaa;
  font-size:18px;
}

/* RESPONSIVE */

@media(max-width:600px){
  .message{
    max-width:88%;
  }

  .brand{
    font-size:18px;
  }

  .inputArea{
    padding-bottom:10px;
  }
}
</style>
</head>

<body>

<!-- AUTH -->

<section id="authScreen">

  <div class="authBox">

    <div class="logo">P-GPT<span>.</span></div>
    <div class="authSub">AI Assistant</div>

    <div id="loginForm">

      <input
        id="loginEmail"
        type="email"
        placeholder="Email"
        autocomplete="email"
      >

      <input
        id="loginPassword"
        type="password"
        placeholder="Password"
        autocomplete="current-password"
      >

      <button class="authBtn" id="loginBtn">
        Login
      </button>

      <div class="switchAuth">
        Don't have an account?
        <button id="showSignup">Create account</button>
      </div>

    </div>

    <div id="signupForm" class="hidden">

      <input
        id="signupName"
        type="text"
        placeholder="Name"
      >

      <input
        id="signupEmail"
        type="email"
        placeholder="Email"
      >

      <input
        id="signupPassword"
        type="password"
        placeholder="Password"
      >

      <button class="authBtn" id="signupBtn">
        Create account
      </button>

      <div class="switchAuth">
        Already have an account?
        <button id="showLogin">Login</button>
      </div>

    </div>

  </div>

</section>


<!-- APP -->

<section id="app" class="hidden">

  <header class="topbar">

    <div class="topLeft">

      <button class="iconBtn" id="menuBtn" aria-label="Menu">

        <svg viewBox="0 0 24 24">
          <path d="M4 6h16M4 12h16M4 18h16"/>
        </svg>

      </button>

      <div class="brand">P-GPT</div>

    </div>


    <div class="topRight">

      <button class="iconBtn" id="newChatBtn" aria-label="New chat">

        <svg viewBox="0 0 24 24">
          <path d="M12 5v14M5 12h14"/>
        </svg>

      </button>

      <button class="iconBtn" id="moreBtn" aria-label="More">

        <svg viewBox="0 0 24 24">
          <circle cx="5" cy="12" r="1"/>
          <circle cx="12" cy="12" r="1"/>
          <circle cx="19" cy="12" r="1"/>
        </svg>

      </button>

    </div>

  </header>


  <!-- MENU -->

  <div id="menu" class="menu hidden">

    <button id="menuNewChat">

      <svg viewBox="0 0 24 24">
        <path d="M12 5v14M5 12h14"/>
      </svg>

      New chat

    </button>


    <button id="menuLive">

      <svg viewBox="0 0 24 24">
        <rect x="8" y="3" width="8" height="12" rx="4"/>
        <path d="M5 11a7 7 0 0 0 14 0M12 18v3M8 21h8"/>
      </svg>

      Live

    </button>


    <button id="menuLogout">

      <svg viewBox="0 0 24 24">
        <path d="M10 5H5v14h5"/>
        <path d="M14 8l4 4-4 4"/>
        <path d="M9 12h9"/>
      </svg>

      Logout

    </button>

  </div>


  <!-- CHAT -->

  <main id="chat">

    <div class="empty" id="emptyState">

      <div class="emptyLogo">P</div>

      <h2>How can I help?</h2>

      <p>Ask anything to P-GPT</p>

    </div>

  </main>


  <!-- INPUT -->

  <div class="inputArea">

    <div id="filePreview" class="filePreview hidden">

      <span id="fileName"></span>

      <button id="removeFile" aria-label="Remove file">×</button>

    </div>


    <div class="inputBox">

      <button class="toolBtn" id="fileBtn" aria-label="File or Photo">

        <svg viewBox="0 0 24 24">
          <path d="M12 5v14M5 12h14"/>
        </svg>

      </button>

      <input
        type="file"
        id="fileInput"
        hidden
        accept="image/*,.txt,.pdf,.doc,.docx"
      >


      <textarea
        id="prompt"
        rows="1"
        placeholder="Message P-GPT..."
      ></textarea>


      <button class="toolBtn" id="voiceBtn" aria-label="Voice">

        <svg viewBox="0 0 24 24">
          <rect x="8" y="3" width="8" height="12" rx="4"/>
          <path d="M5 11a7 7 0 0 0 14 0M12 18v3M8 21h8"/>
        </svg>

      </button>


      <button class="toolBtn" id="liveBtn" aria-label="Live">

        <svg viewBox="0 0 24 24">
          <path d="M4 9v6M8 6v12M12 3v18M16 6v12M20 9v6"/>
        </svg>

      </button>


      <button class="sendBtn" id="sendBtn" aria-label="Send" disabled>

        <svg viewBox="0 0 24 24">
          <path d="M5 12h13"/>
          <path d="M13 6l6 6-6 6"/>
        </svg>

      </button>

    </div>

  </div>

</section>


<!-- LIVE PANEL -->

<section id="livePanel" class="livePanel hidden">

  <header class="liveTop">

    <button class="iconBtn" id="closeLive">

      <svg viewBox="0 0 24 24">
        <path d="M6 6l12 12M18 6L6 18"/>
      </svg>

    </button>

    <div class="liveTitle">P-GPT Live</div>

    <div style="width:38px"></div>

  </header>


  <div class="liveCenter">

    <div class="liveCircle">

      <svg viewBox="0 0 24 24">
        <rect x="8" y="3" width="8" height="12" rx="4"/>
        <path d="M5 11a7 7 0 0 0 14 0M12 18v3M8 21h8"/>
      </svg>

    </div>

    <div id="liveStatus" class="liveStatus">
      Tap the microphone to start
    </div>

    <button class="liveMic" id="liveMic">

      <svg viewBox="0 0 24 24">
        <rect x="8" y="3" width="8" height="12" rx="4"/>
        <path d="M5 11a7 7 0 0 0 14 0M12 18v3M8 21h8"/>
      </svg>

    </button>

  </div>

</section>


<script>

/* =========================
   P-GPT API
========================= */

const API_URL =
  "https://p-gpt-api.pgptai2026.workers.dev";


/* =========================
   ELEMENTS
========================= */

const authScreen =
  document.getElementById("authScreen");

const app =
  document.getElementById("app");

const loginForm =
  document.getElementById("loginForm");

const signupForm =
  document.getElementById("signupForm");

const loginEmail =
  document.getElementById("loginEmail");

const loginPassword =
  document.getElementById("loginPassword");

const signupName =
  document.getElementById("signupName");

const signupEmail =
  document.getElementById("signupEmail");

const signupPassword =
  document.getElementById("signupPassword");

const loginBtn =
  document.getElementById("loginBtn");

const signupBtn =
  document.getElementById("signupBtn");

const chat =
  document.getElementById("chat");

const emptyState =
  document.getElementById("emptyState");

const prompt =
  document.getElementById("prompt");

const sendBtn =
  document.getElementById("sendBtn");

const fileBtn =
  document.getElementById("fileBtn");

const fileInput =
  document.getElementById("fileInput");

const filePreview =
  document.getElementById("filePreview");

const fileName =
  document.getElementById("fileName");

const removeFile =
  document.getElementById("removeFile");

const voiceBtn =
  document.getElementById("voiceBtn");

const liveBtn =
  document.getElementById("liveBtn");

const menuBtn =
  document.getElementById("menuBtn");

const moreBtn =
  document.getElementById("moreBtn");

const menu =
  document.getElementById("menu");

const newChatBtn =
  document.getElementById("newChatBtn");

const menuNewChat =
  document.getElementById("menuNewChat");

const menuLive =
  document.getElementById("menuLive");

const menuLogout =
  document.getElementById("menuLogout");

const livePanel =
  document.getElementById("livePanel");

const closeLive =
  document.getElementById("closeLive");

const liveMic =
  document.getElementById("liveMic");

const liveStatus =
  document.getElementById("liveStatus");


/* =========================
   AUTH
========================= */

function showApp(){

  authScreen.classList.add("hidden");

  app.classList.remove("hidden");

}


function showAuth(){

  app.classList.add("hidden");

  authScreen.classList.remove("hidden");

}


if(localStorage.getItem("pgpt_logged_in")==="true"){

  showApp();

}


/* LOGIN */

loginBtn.addEventListener("click",()=>{

  const email =
    loginEmail.value.trim();

  const password =
    loginPassword.value.trim();

  if(!email || !password){

    alert("Enter email and password.");

    return;

  }

  /*
    Temporary local login.

    Real D1 authentication can be connected
    later through the Worker.
  */

  localStorage.setItem(
    "pgpt_logged_in",
    "true"
  );

  showApp();

});


/* SIGNUP */

signupBtn.addEventListener("click",()=>{

  const name =
    signupName.value.trim();

  const email =
    signupEmail.value.trim();

  const password =
    signupPassword.value.trim();

  if(!name || !email || !password){

    alert("Complete all fields.");

    return;

  }

  localStorage.setItem(
    "pgpt_user_name",
    name
  );

  localStorage.setItem(
    "pgpt_logged_in",
    "true"
  );

  showApp();

});


/* AUTH SWITCH */

document
.getElementById("showSignup")
.addEventListener("click",()=>{

  loginForm.classList.add("hidden");

  signupForm.classList.remove("hidden");

});


document
.getElementById("showLogin")
.addEventListener("click",()=>{

  signupForm.classList.add("hidden");

  loginForm.classList.remove("hidden");

});


/* LOGOUT */

function logout(){

  localStorage.removeItem(
    "pgpt_logged_in"
  );

  localStorage.removeItem(
    "pgpt_user_name"
  );

  chat.innerHTML = "";

  showAuth();

}


menuLogout.addEventListener(
  "click",
  logout
);


/* =========================
   MENU
========================= */

function toggleMenu(){

  menu.classList.toggle("hidden");

}


menuBtn.addEventListener(
  "click",
  toggleMenu
);

moreBtn.addEventListener(
  "click",
  toggleMenu
);


document.addEventListener("click",(e)=>{

  if(
    !menu.contains(e.target) &&
    !menuBtn.contains(e.target) &&
    !moreBtn.contains(e.target)
  ){

    menu.classList.add("hidden");

  }

});


/* =========================
   NEW CHAT
========================= */

function newChat(){

  chat.innerHTML = "";

  chat.appendChild(emptyState);

  emptyState.classList.remove("hidden");

  prompt.value = "";

  updateSendButton();

  filePreview.classList.add("hidden");

  fileInput.value = "";

  menu.classList.add("hidden");

}


newChatBtn.addEventListener(
  "click",
  newChat
);

menuNewChat.addEventListener(
  "click",
  newChat
);


/* =========================
   INPUT
========================= */

prompt.addEventListener("input",()=>{

  prompt.style.height = "auto";

  prompt.style.height =
    Math.min(prompt.scrollHeight,130) + "px";

  updateSendButton();

});


function updateSendButton(){

  sendBtn.disabled =
    !prompt.value.trim() &&
    !fileInput.files.length;

}


/* ENTER */

prompt.addEventListener("keydown",(e)=>{

  if(
    e.key==="Enter" &&
    !e.shiftKey
  ){

    e.preventDefault();

    if(!sendBtn.disabled){

      sendBtn.click();

    }

  }

});


/* =========================
   FILE / PHOTO
========================= */

fileBtn.addEventListener("click",()=>{

  fileInput.click();

});


fileInput.addEventListener("change",()=>{

  const file =
    fileInput.files[0];

  if(!file){

    filePreview.classList.add("hidden");

    updateSendButton();

    return;

  }

  fileName.textContent =
    file.name;

  filePreview.classList.remove(
    "hidden"
  );

  updateSendButton();

});


removeFile.addEventListener("click",()=>{

  fileInput.value = "";

  filePreview.classList.add(
    "hidden"
  );

  updateSendButton();

});


/* =========================
   CHAT MESSAGE
========================= */

function addMessage(
  text,
  type
){

  emptyState.classList.add(
    "hidden"
  );

  const row =
    document.createElement("div");

  row.className =
    "messageRow " + type;

  const bubble =
    document.createElement("div");

  bubble.className =
    "message";

  bubble.textContent =
    text;

  row.appendChild(bubble);

  chat.appendChild(row);

  chat.scrollTop =
    chat.scrollHeight;

  return bubble;

}


/* =========================
   LOADING
========================= */

function addLoading(){

  emptyState.classList.add(
    "hidden"
  );

  const row =
    document.createElement("div");

  row.className =
    "messageRow ai";

  const bubble =
    document.createElement("div");

  bubble.className =
    "message loading";

  bubble.innerHTML = `
    <span class="spinner"></span>
    <span>Thinking</span>
  `;

  row.appendChild(bubble);

  chat.appendChild(row);

  chat.scrollTop =
    chat.scrollHeight;

  return row;

}


/* =========================
   AI API
========================= */

async function askAI(message){

  const response =
    await fetch(API_URL,{
      method:"POST",

      headers:{
        "Content-Type":
          "application/json"
      },

      body:JSON.stringify({

        message:message

      })

    });


  if(!response.ok){

    throw new Error(
      "API HTTP " +
      response.status
    );

  }


  const data =
    await response.json();


  /*
    Supports common Worker response
    formats.
  */

  return (
    data.response ??
    data.reply ??
    data.message ??
    data.text ??
    data.result ??
    "No response received."
  );

}


/* =========================
   SEND
========================= */

sendBtn.addEventListener(
  "click",
  sendMessage
);


async function sendMessage(){

  const text =
    prompt.value.trim();

  const file =
    fileInput.files[0];


  if(!text && !file){

    return;

  }


  let userText =
    text;


  if(file){

    userText +=
      userText
      ? "\nFile: " + file.name
      : "File: " + file.name;

  }


  addMessage(
    userText,
    "user"
  );


  prompt.value = "";

  prompt.style.height =
    "auto";

  fileInput.value = "";

  filePreview.classList.add(
    "hidden"
  );

  updateSendButton();


  const loading =
    addLoading();


  try{

    const answer =
      await askAI(text || file.name);


    loading.remove();


    addAIMessage(
      String(answer)
    );


  }catch(error){

    loading.remove();


    addAIMessage(
      "AI request failed. Check your Cloudflare Worker and API configuration."
    );

    console.error(
      "P-GPT API Error:",
      error
    );

  }

}


/* =========================
   AI MESSAGE TOOLS
========================= */

function addAIMessage(text){

  emptyState.classList.add(
    "hidden"
  );

  const row =
    document.createElement("div");

  row.className =
    "messageRow ai";


  const wrapper =
    document.createElement("div");


  const bubble =
    document.createElement("div");

  bubble.className =
    "message";

  bubble.textContent =
    text;


  const tools =
    document.createElement("div");

  tools.className =
    "messageTools";


  /* COPY */

  const copyBtn =
    document.createElement("button");

  copyBtn.innerHTML = `
    <svg viewBox="0 0 24 24">
      <rect x="9" y="9" width="11" height="11" rx="2"/>
      <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
    </svg>
  `;

  copyBtn.title =
    "Copy";

  copyBtn.onclick = async()=>{

    await navigator.clipboard.writeText(
      text
    );

  };


  /* SPEAK */

  const speakBtn =
    document.createElement("button");

  speakBtn.innerHTML = `
    <svg viewBox="0 0 24 24">
      <path d="M4 10v4h4l5 4V6l-5 4H4z"/>
      <path d="M17 9a4 4 0 0 1 0 6"/>
      <path d="M19 6a8 8 0 0 1 0 12"/>
    </svg>
  `;

  speakBtn.title =
    "Read aloud";

  speakBtn.onclick =()=>{

    if(
      "speechSynthesis"
      in window
    ){

      speechSynthesis.cancel();

      const utter =
        new SpeechSynthesisUtterance(
          text
        );

      speechSynthesis.speak(
        utter
      );

    }

  };


  tools.appendChild(copyBtn);

  tools.appendChild(speakBtn);

  wrapper.appendChild(bubble);

  wrapper.appendChild(tools);

  row.appendChild(wrapper);

  chat.appendChild(row);

  chat.scrollTop =
    chat.scrollHeight;

}


/* =========================
   VOICE INPUT
========================= */

let recognition = null;

const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;


if(SpeechRecognition){

  recognition =
    new SpeechRecognition();

  recognition.lang =
    "bn-BD";

  recognition.continuous =
    false;

  recognition.interimResults =
    false;


  recognition.onresult =
    (event)=>{

      const result =
        event.results[0][0].transcript;

      prompt.value +=
        (prompt.value ? " " : "") +
        result;

      updateSendButton();

    };


  recognition.onerror =
    ()=>{

      voiceBtn.style.color =
        "";

    };


  recognition.onend =
    ()=>{

      voiceBtn.style.color =
        "";

    };

}


voiceBtn.addEventListener(
  "click",
  ()=>{

    if(!recognition){

      alert(
        "Voice recognition is not supported in this browser."
      );

      return;

    }


    try{

      voiceBtn.style.color =
        "#fff";

      recognition.start();

    }catch(error){

      console.log(error);

    }

  }
);


/* =========================
   LIVE
========================= */

function openLive(){

  livePanel.classList.remove(
    "hidden"
  );

  menu.classList.add(
    "hidden"
  );

}


function closeLivePanel(){

  livePanel.classList.add(
    "hidden"
  );

}


liveBtn.addEventListener(
  "click",
  openLive
);

menuLive.addEventListener(
  "click",
  openLive
);

closeLive.addEventListener(
  "click",
  closeLivePanel
);


/* LIVE VOICE */

let liveRecognition = null;


if(SpeechRecognition){

  liveRecognition =
    new SpeechRecognition();

  liveRecognition.lang =
    "bn-BD";

  liveRecognition.continuous =
    false;

  liveRecognition.interimResults =
    false;


  liveRecognition.onstart =
    ()=>{

      liveStatus.textContent =
        "Listening...";

    };


  liveRecognition.onresult =
    async(event)=>{

      const text =
        event.results[0][0].transcript;


      liveStatus.textContent =
        "Thinking";


      try{

        const answer =
          await askAI(text);


        liveStatus.textContent =
          String(answer);


        if(
          "speechSynthesis"
          in window
        ){

          speechSynthesis.cancel();

          const utter =
            new SpeechSynthesisUtterance(
              String(answer)
            );

          speechSynthesis.speak(
            utter
          );

        }


      }catch(error){

        liveStatus.textContent =
          "AI request failed.";

        console.error(error);

      }

    };


  liveRecognition.onend =
    ()=>{

      if(
        liveStatus.textContent ===
        "Listening..."
      ){

        liveStatus.textContent =
          "Tap the microphone to start";

      }

    };

}


liveMic.addEventListener(
  "click",
  ()=>{

    if(!liveRecognition){

      liveStatus.textContent =
        "Voice recognition is not supported.";

      return;

    }


    try{

      liveRecognition.start();

    }catch(error){

      console.log(error);

    }

  }
);

</script>
